<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IGCSE LAB · 受邀登录</title><style>body{font:16px system-ui;background:#eef2ff;color:#1e293b;margin:0;padding:24px}main{max-width:420px;background:white;border-radius:18px;padding:24px;margin:8vh auto}label{display:block;margin:16px 0}input,button{font:inherit;box-sizing:border-box;width:100%;padding:12px;border-radius:8px;border:1px solid #cbd5e1}button{background:#4338ca;color:white;cursor:pointer}p{line-height:1.6}#status{min-height:24px;color:#b91c1c}</style></head><body><main><h1>IGCSE LAB</h1><p>私人测试版 · 仅限管理员邀请的学习者</p><form id="login"><label>受邀账号<input name="username" autocomplete="username" maxlength="40" required></label><label>密码<input name="password" type="password" autocomplete="current-password" minlength="12" maxlength="256" required></label><button>登录学习平台</button><p id="status" role="status"></p></form><p>教材、草稿与学习记录保存在本机浏览器。共享设备建议为每位学习者使用独立浏览器档案。</p></main><script>document.getElementById('login').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,b=form.querySelector('button'),s=document.getElementById('status');b.disabled=true;s.textContent='正在登录…';try{const r=await fetch('/auth/login',{method:'POST',body:new URLSearchParams(new FormData(form)),redirect:'follow'});if(r.ok&&r.url.endsWith('/'))location.replace('/');else{const v=await r.json();s.textContent=v.error||'登录未完成';}}catch{s.textContent='连接失败，请稍后重试';}finally{b.disabled=false;form.elements.password.value='';}};</script></body></html>
